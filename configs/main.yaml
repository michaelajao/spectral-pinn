# Phase 1 comparison matrix: spectral variants vs baselines on the dam-break
# benchmarks. The soft (cnPINN) penalty is Wang et al.'s Eq. 15, w_U * D_U^2
# with D_U the matrix 2-norm of U^T U - I (defect_norm: spectral, the
# default).
#
# What is actually running: this matrix was launched 2026-08-25 13:27, before
# the Eq. 15 correction landed at 13:50, so the live process holds the six
# entries below with a Frobenius-norm penalty in cnpinn_soft. Only the soft
# variant reads that norm; every other entry is unaffected. The corrected soft
# variant and the w_U bracket run additively in configs/soft_sweep.yaml
# (w_U = 2.857e-5, 1e-3, 1e-6 on the two completed benchmarks) rather than
# here, so re-running this file does not duplicate them. No published w_U
# exists for shallow-water flow; theirs span 1/600 .. 1/200000 across five
# PDEs, and the headline cnpinn_soft row uses the advection value until the
# sweep says otherwise. The sweep does not cover w_U = 1e-4.
device: auto
seeds: [0, 1, 2, 3, 4]
entries:
  - {name: pinn,         kind: pinn, variables: primitive}
  - {name: pinn_fourier, kind: pinn, variables: primitive, fourier_features: 32}
  - {name: cnpinn_soft,  kind: pinn, variables: primitive, weight_param: svd_soft, w_U: 2.857e-5}
  - {name: ortho_hard,   kind: pinn, variables: primitive, weight_param: svd_hard}
  - {name: svd_sigma,    kind: pinn, variables: primitive, weight_param: svd_sigma}
  - {name: fvm_pinn,     kind: fvm}
benchmarks:
  - {id: ca_circular_wet, reference_n: 512, grid_n: 128}
  - {id: ca_circular_dry, reference_n: 512, grid_n: 128}
  - {id: ca_step,         reference_n: 512, grid_n: 128}
  - {id: ca_gaussian,     reference_n: 512, grid_n: 128}
  - {id: b3_three_humps,  reference_n: 512, grid_n: 128}
train:
  iters: 20000
  lr: 1.0e-3
  grad_clip: 1.0
  n_collocation: 20000
  fvm_times: 41
  fvm_nsub_max: 24
  fvm_stochastic: true
