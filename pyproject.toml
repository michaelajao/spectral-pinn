[project]
name = "spectral-pinn"
version = "0.1.0"
description = "Spectral control of physics-informed neural networks: penalty-free orthogonal weight reparameterization, evaluated on shock-dominated shallow-water flows"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6,<3",
    "numpy>=2.0,<3",
    "matplotlib>=3.9,<4",
    "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
